plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'io.github.aicybridge'
    // The official libxposed API 102 AAR declares minCompileSdk=37.
    compileSdk 37
    compileSdkMinor 0
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'io.github.aicybridge'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'TARGET_PACKAGE', '"com.meizu.voiceassistant"'
        buildConfigField 'String', 'TARGET_CERT_SHA256', '"94153299d67ab1b37a39ed5fe17e893df87084fb129077be51863bcbd9132336"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

dependencies {
    implementation project(':core')
    compileOnly 'io.github.libxposed:api:102.0.0'
}
