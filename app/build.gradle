plugins {
    id 'com.android.application' version '9.5.1'
    id 'org.jetbrains.kotlin.android' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
}

android {
    namespace 'io.github.aicybridge'
    // The official libxposed API 102 AAR declares minCompileSdk=37.
    compileSdk 37
    compileSdkMinor 0
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'io.github.aicybridge'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'TARGET_PACKAGE', '"com.meizu.voiceassistant"'
        buildConfigField 'String', 'TARGET_CERT_SHA256', '"94153299d67ab1b37a39ed5fe17e893df87084fb129077be51863bcbd9132336"'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', rootProject.layout.projectDirectory.dir('.gradle/robolectric').asFile.absolutePath
            ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort', 'javax.net.ssl.trustStore'].each { property ->
                def value = System.getProperty(property)
                if (value != null) systemProperty property, value
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

dependencies {
    implementation project(':core')
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4:1.12.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
